<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playing Cards</title>
<link rel="stylesheet" href="Playing cards.css">
</head>

<body>

<div class="container">

<div class="card red">
<div class="top">A ♥</div>
<div class="symbol">♥</div>
<div class="bottom">♥ A</div>
</div>

<div class="card red">
<div class="top">A ♦</div>
<div class="symbol">♦</div>
<div class="bottom">♦ A</div>
</div>

<div class="card black">
<div class="top">A ♠</div>
<div class="symbol">♠</div>
<div class="bottom">♠ A</div>
</div>

<div class="card black">
<div class="top">A ♣</div>
<div class="symbol">♣</div>
<div class="bottom">♣ A</div>
</div>

</div>

</body>
</html>
